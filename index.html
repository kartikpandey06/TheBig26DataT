<!DOCTYPE html>
<html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>QuickDrop</title><script src='https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js'></script><style>body{font-family:Arial;padding:20px;max-width:700px;margin:auto;background:#0f172a;color:#fff}input,button{padding:10px;margin:6px;border-radius:10px;border:none}button{background:#22c55e;color:#000;font-weight:bold}#log{background:#111827;padding:10px;border-radius:12px;height:220px;overflow:auto}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><h2>QuickDrop 🔒</h2><p>Open on laptop + mobile. Share your ID, connect, send text/files directly (P2P).</p><div>Your ID: <b id='myid'>...</b></div><div class='row'><input id='peerid' placeholder='Enter other device ID'><button onclick='connectPeer()'>Connect</button></div><div class='row'><input id='msg' placeholder='Type message'><button onclick='sendMsg()'>Send</button></div><div class='row'><input type='file' id='file'><button onclick='sendFile()'>Send File</button></div><div id='log'></div><script>let conn;const log=t=>document.getElementById('log').innerHTML+=t+'<br>';const peer=new Peer();peer.on('open',id=>document.getElementById('myid').innerText=id);peer.on('connection',c=>setup(c));function connectPeer(){setup(peer.connect(document.getElementById('peerid').value));}function setup(c){conn=c;conn.on('open',()=>log('Connected'));conn.on('data',d=>{if(d.type==='msg')log('Peer: '+d.text);if(d.type==='file'){const a=document.createElement('a');a.href=d.data;a.download=d.name;a.innerText='Download '+d.name;document.getElementById('log').appendChild(a);document.getElementById('log').appendChild(document.createElement('br'));}});}function sendMsg(){const t=msg.value;conn.send({type:'msg',text:t});log('You: '+t);msg.value='';}function sendFile(){const f=file.files[0];const r=new FileReader();r.onload=()=>conn.send({type:'file',name:f.name,data:r.result});r.readAsDataURL(f);}</script></body></html>
